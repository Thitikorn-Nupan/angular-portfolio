<ng-container>
  <div id="top"></div>
  <nav class="navbar navbar-expand-lg bg-secondary text-uppercase fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand" [href]="aLinks[0].href">{{ aLinks[0].text }}</a>
      <button class="navbar-toggler text-uppercase font-weight-bold bg-primary text-white rounded"
              type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
              aria-controls="navbarResponsive"
              aria-expanded="false" aria-label="Toggle navigation"
              (click)="onNavButtonClick()">
        Menu <i class="fas fa-bars"></i>
      </button>
      <!-- if clicked romove collapse -->
      <div class="{{isNavButtonClick ? '' : 'collapse'}} navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ms-auto">
          <ng-container *ngFor="let aLink of aLinks; let i = index">
            <ng-container *ngIf="i !== 0">
              <li class="nav-item mx-0 mx-lg-1">
                <a class="nav-link py-3 px-0 px-lg-3 rounded" [href]="aLink.href">{{ aLink.text }}</a>
              </li>
            </ng-container>
          </ng-container>
        </ul>
      </div>
    </div>
  </nav>
</ng-container>
